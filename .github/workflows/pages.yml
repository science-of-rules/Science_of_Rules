# Publishes the website to GitHub Pages: https://science-of-rules.github.io/Science_of_Rules/
# Every push to main rebuilds dist/ from the tracked sources, validates it, and deploys it.
# If validation fails, nothing is deployed and the previous version stays online.
name: Deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build and validate
        run: |
          python3 --version
          python3 scripts/build.py
          python3 scripts/validate.py
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
